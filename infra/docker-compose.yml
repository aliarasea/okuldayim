# Okuldayım — yerel geliştirme altyapısı
#
# Servisler: PostgreSQL (RLS), Redis (önbellek + pub/sub), HashiCorp Vault (sır ve anahtar
# yönetimi), RustFS (S3 uyumlu medya depolama), Mailpit (e-posta OTP yakalayıcı).
#
# KVKK notları:
#  - Tüm portlar yalnızca 127.0.0.1'e açılır; servisler ağdan erişilemez.
#  - Bu ortamda üretim verisi kullanılmaz, yalnızca sentetik veri.
#  - Vault burada tek düğüm ve TLS'siz çalışır; unseal anahtarı yerel diske yazılır.
#    Üretimde TLS, çok düğümlü raft ve HSM/KMS ile otomatik unseal zorunludur.
#
# Kullanım: bkz. infra/README.md

name: okuldayim

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - okuldayim

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okuldayim}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD .env dosyasında tanımlı olmalı}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      # İlk kurulum betiğinin kullandığı rol parolaları
      OKULDAYIM_MIGRATOR_PASSWORD: ${OKULDAYIM_MIGRATOR_PASSWORD:?OKULDAYIM_MIGRATOR_PASSWORD .env dosyasında tanımlı olmalı}
      VAULT_DB_ADMIN_PASSWORD: ${VAULT_DB_ADMIN_PASSWORD:?VAULT_DB_ADMIN_PASSWORD .env dosyasında tanımlı olmalı}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
    volumes:
      # PostgreSQL 18 imajı veriyi /var/lib/postgresql/18/docker altında tutar
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Tek seferlik migration aracı; compose up varsayılanında uygulama şemasını değiştirmez.
  postgres-migrate:
    image: postgres:18.6-alpine
    profiles: ["tools"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - okuldayim
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]
    environment:
      MIGRATION_DATABASE_HOST: postgres
      MIGRATION_DATABASE_PORT: 5432
      MIGRATION_DATABASE_NAME: ${POSTGRES_DB:-okuldayim}
      MIGRATION_DATABASE_USER: okuldayim_migrator
      MIGRATION_DATABASE_PASSWORD: ${OKULDAYIM_MIGRATOR_PASSWORD:?OKULDAYIM_MIGRATOR_PASSWORD .env dosyasında tanımlı olmalı}
    volumes:
      - ./postgres:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    <<: *hardening
    image: redis:8.8-alpine
    user: redis
    # redis.conf maxmemory 256mb leaves headroom below this container limit.
    mem_limit: 384m
    environment:
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD:?REDIS_APP_PASSWORD .env dosyasında tanımlı olmalı}
    # ACL dosyası parolayı imaja/diske gömmemek için başlangıçta üretilir.
    # default kullanıcı kapalı; "app" kullanıcısı yönetim komutlarını çalıştıramaz.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'user default off\nuser app on >%s ~* &* +@all -@admin -flushall -flushdb\n' "$$REDIS_APP_PASSWORD" > /tmp/users.acl
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /tmp/users.acl
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user app --pass \"$${REDIS_APP_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    <<: *hardening
    image: hashicorp/vault:2.2.1
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # mlock yapılandırmada kapalı olduğu için IPC_LOCK yetkisine gerek yok
      SKIP_SETCAP: "true"
    volumes:
      - ./vault/config:/vault/config:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    # Vault her başlatıldığında mühürlü açılır; vault-bootstrap açana kadar "unhealthy" görünür.
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Tek seferlik: Vault'u ilk kez başlatır, mührünü açar ve motorları/politikaları kurar.
  # İdempotenttir; her "docker compose up" çağrısında yeniden çalışıp Vault'un mührünü açar.
  vault-bootstrap:
    image: hashicorp/vault:2.2.1
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - okuldayim
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-okuldayim}
      VAULT_DB_ADMIN_PASSWORD: ${VAULT_DB_ADMIN_PASSWORD:?VAULT_DB_ADMIN_PASSWORD .env dosyasında tanımlı olmalı}
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD:?REDIS_APP_PASSWORD .env dosyasında tanımlı olmalı}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY .env dosyasında tanımlı olmalı}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY .env dosyasında tanımlı olmalı}
      JASMIN_USERNAME: ${JASMIN_USERNAME:-}
      JASMIN_PASSWORD: ${JASMIN_PASSWORD:-}
    volumes:
      - ./vault/scripts:/scripts:ro
      - ./vault/policies:/policies:ro
      # Unseal anahtarı, root token ve backend AppRole bilgileri (yalnızca geliştirme; git'e girmez)
      - ./.local/vault:/vault/bootstrap
      # Backend'e yalnız AppRole dosyasını vermek için root/unseal dosyalarından ayrı volume.
      - vault-backend-approle:/vault/approle
    depends_on:
      vault:
        condition: service_started
      postgres:
        condition: service_healthy
      vault-approle-volume-init:
        condition: service_completed_successfully

  # Named volume'u Vault container UID'sinin yazabileceği ve API UID/GID'sinin okuyabileceği
  # şekilde hazırlar. İçerik yalnız backend AppRole kimliğidir.
  vault-approle-volume-init:
    image: busybox:1.37.0
    restart: "no"
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c", "chown 100:10001 /vault-approle && chmod 2750 /vault-approle"]
    volumes:
      - vault-backend-approle:/vault-approle

  api:
    <<: *hardening
    mem_limit: 256m
    stop_grace_period: 30s
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      OKD_ENV: development
      OKD_HTTP_ADDR: 0.0.0.0:8080
      OKD_VAULT_ADDR: http://vault:8200
      OKD_VAULT_APPROLE_FILE: /run/secrets/backend-approle.env
      OKD_DB_HOST: postgres
      OKD_DB_PORT: 5432
      OKD_DB_NAME: ${POSTGRES_DB:-okuldayim}
      OKD_DB_SSL_MODE: disable
      OKD_REDIS_HOST: redis
      OKD_REDIS_PORT: 6379
      OKD_SMS_GATEWAY_URL: ${OKD_SMS_GATEWAY_URL:-}
      OKD_DB_MAX_CONNECTIONS: ${OKD_DB_MAX_CONNECTIONS:-12}
      RUST_LOG: info
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - vault-backend-approle:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        # Redis-dependent product routes can fail closed while unrelated DB-backed routes stay up.
        condition: service_started
      vault-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  object-storage:
    <<: *hardening
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY .env dosyasında tanımlı olmalı}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY .env dosyasında tanımlı olmalı}
      RUSTFS_OBS_LOGGER_LEVEL: info
    volumes:
      - object-storage-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Tek seferlik: medya bucket'larını ve yaşam döngüsü kurallarını oluşturur.
  storage-init:
    image: amazon/aws-cli:2.38.6
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - okuldayim
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    environment:
      S3_ENDPOINT: http://object-storage:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY .env dosyasında tanımlı olmalı}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY .env dosyasında tanımlı olmalı}
      AWS_DEFAULT_REGION: us-east-1
      # S3 uyumlu sunucularda sorun çıkaran varsayılan checksum başlıklarını kapatır
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./object-storage:/scripts:ro
    depends_on:
      object-storage:
        condition: service_healthy

  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.32.0
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  okuldayim:
    name: okuldayim

volumes:
  postgres-data:
  vault-data:
  vault-logs:
  vault-backend-approle:
  object-storage-data:
