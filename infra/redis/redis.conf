# Okuldayım — yerel geliştirme Redis yapılandırması
#
# Kullanım: önbellek, OTP deneme sayaçları ve pub/sub (teslim kuyruğu, mesaj dağıtımı).
# KVKK: Redis'e kişisel veri içeriği yazılmaz; yalnızca kimlikler (UUID), sayaçlar ve olay bildirimleri.
# Kalıcılık kapalıdır, yeniden başlatmada diske veri bırakılmaz.

bind 0.0.0.0
port 6379
# Erişim ACL kullanıcılarıyla sınırlı (bkz. docker-compose.yml); host tarafında port yalnızca 127.0.0.1'e açık.
protected-mode no

save ""
appendonly no

maxmemory 256mb
# OTP/rate-limit güvenlik sayaçları bellek baskısında sessizce tahliye edilmemeli.
# Bellek dolarsa yazmalar reddedilir; uygulama bu durumda doğrulamayı fail-closed yapmalıdır.
maxmemory-policy noeviction
